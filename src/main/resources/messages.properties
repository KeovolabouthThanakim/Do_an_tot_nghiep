info.faq.eyebrow=HỖ TRỢ KHÁCH HÀNG
info.faq.lede=Giải đáp nhanh những câu hỏi chúng tôi nhận được nhiều nhất.
info.faq.s1.b=Bạn có thể chuyển khoản toàn bộ (quét mã QR ở bước thanh toán và tải ảnh bill lên) hoặc chọn thanh toán khi nhận hàng (COD). Với COD, bạn cần chuyển khoản đặt cọc một phần giá trị đơn trước (số tiền hiển thị ở bước thanh toán), phần còn lại trả cho nhân viên giao hàng khi nhận hàng. Nếu bạn không nhận hàng mà không có lý do chính đáng, tiền cọc sẽ không được hoàn lại.
info.faq.s1.h=Tôi thanh toán bằng cách nào?
info.faq.s2.b=Nhân viên sẽ kiểm tra ảnh bill và xác nhận đơn. Bạn có thể theo dõi trạng thái tại mục Đơn hàng của tôi.
info.faq.s2.h=Khi nào đơn chuyển khoản được xác nhận?
info.faq.s3.b=Trang sản phẩm có liệt kê các kích cỡ còn hàng. Nếu phân vân giữa hai size, bạn nên chọn size lớn hơn với áo khoác.
info.faq.s3.h=Làm sao chọn kích cỡ?
info.faq.s4.b=Bạn có thể xem sản phẩm và thêm vào giỏ hàng mà không cần đăng nhập. Tài khoản cần thiết ở bước thanh toán để bạn theo dõi đơn hàng.
info.faq.s4.h=Tôi có cần tài khoản không?
info.faq.title=Câu hỏi thường gặp
info.our-story.eyebrow=VỀ KOSIS
info.our-story.lede=Một thương hiệu nhỏ với tầm nhìn dài hạn về những gì chúng ta mặc.
info.our-story.s1.b=KOSIS bắt đầu từ một ý tưởng giản dị: quần áo nên tinh tế chứ không ồn ào. Chúng tôi thiết kế với bảng màu trung tính và chất liệu tự nhiên để mỗi món đồ đều dễ phối với tủ đồ của bạn.
info.our-story.s1.h=Vì sao là KOSIS
info.our-story.s2.b=Chúng tôi chọn chất liệu cẩn thận, giữ bộ sưu tập nhỏ gọn và hợp tác với những người thợ cùng chia sẻ sự kiên nhẫn đó.
info.our-story.s2.h=Cách chúng tôi làm việc
info.our-story.s3.b=Nhiều thiết kế hơn cho nhiều người hơn, nhưng luôn nghĩ đến việc sở hữu ít hơn mà tốt hơn.
info.our-story.s3.h=Chúng tôi hướng tới
info.our-story.title=Câu chuyện thương hiệu
info.privacy.eyebrow=VỀ KOSIS
info.privacy.lede=Chúng tôi thu thập những thông tin nào, dùng vào việc gì và bạn kiểm soát chúng ra sao.
info.privacy.s1.b=Tài khoản: tên đăng nhập, mật khẩu (được mã hóa một chiều, nhân viên không xem được), họ tên, email, số điện thoại, địa chỉ. Đơn hàng: người nhận, số điện thoại, địa chỉ giao hàng, ghi chú, sản phẩm đã mua, hình thức thanh toán và ảnh bill chuyển khoản bạn tải lên. Ngoài ra: tin nhắn bạn gửi ở trang Liên hệ, email đăng ký nhận bản tin, nội dung đánh giá sản phẩm, yêu cầu trả hàng và danh sách yêu thích khi bạn đã đăng nhập.
info.privacy.s1.h=Thông tin chúng tôi thu thập
info.privacy.s2.b=Xử lý, giao và hỗ trợ đơn hàng; xác nhận thanh toán; xuất hóa đơn; xử lý đổi trả, hoàn tiền; trả lời liên hệ; gửi email về đơn hàng và đặt lại mật khẩu. Email bản tin chỉ dùng để gửi thông tin bộ sưu tập mới khi bạn đã đăng ký. Chúng tôi không bán thông tin cá nhân của bạn.
info.privacy.s2.h=Mục đích sử dụng
info.privacy.s3.b=Đơn vị vận chuyển nhận tên, số điện thoại và địa chỉ giao hàng để giao đơn. Với đơn chuyển khoản, mã QR được tạo qua dịch vụ VietQR (img.vietqr.io) nên số tài khoản nhận tiền, số tiền và nội dung chuyển khoản của đơn sẽ được gửi tới dịch vụ này. Email được gửi qua nhà cung cấp dịch vụ thư mà cửa hàng cấu hình. Trang web tải phông chữ từ Google Fonts và biểu tượng từ jsDelivr nên các dịch vụ này có thể nhận địa chỉ IP của bạn. Chúng tôi cũng có thể cung cấp thông tin khi cơ quan nhà nước có thẩm quyền yêu cầu theo quy định pháp luật.
info.privacy.s3.h=Chia sẻ với bên thứ ba
info.privacy.s4.b=Website dùng cookie phiên (đăng nhập, giỏ hàng) và cookie bảo mật chống giả mạo biểu mẫu; các cookie này cần thiết để website hoạt động. Một số thiết lập hiển thị có thể được lưu trong bộ nhớ của trình duyệt. Địa chỉ IP được dùng tạm thời để giới hạn số lần đăng nhập/đăng ký bất thường nhằm chống dò mật khẩu và không được lưu lâu dài.
info.privacy.s4.h=Cookie và dữ liệu lưu trên trình duyệt
info.privacy.s5.b=Mật khẩu được mã hóa, ảnh bill được lưu ở khu vực không công khai và chỉ chủ đơn hoặc nhân viên có quyền mới xem được. Dữ liệu đơn hàng được giữ trong thời gian cần thiết để xử lý đơn, bảo hành, đổi trả và đáp ứng nghĩa vụ kế toán, thuế theo quy định. Không có hệ thống nào an toàn tuyệt đối; nếu phát hiện sự cố liên quan đến dữ liệu của bạn, chúng tôi sẽ thông báo theo quy định.
info.privacy.s5.h=Lưu trữ và bảo mật
info.privacy.s6.b=Bạn có thể xem và cập nhật họ tên, email, số điện thoại, địa chỉ tại Tài khoản của tôi; và liên hệ (kể cả để hủy nhận bản tin) để yêu cầu truy cập, chỉnh sửa, hạn chế xử lý hoặc xóa dữ liệu, rút lại sự đồng ý theo quy định pháp luật Việt Nam về bảo vệ dữ liệu cá nhân (Nghị định 13/2023/NĐ-CP). Một số dữ liệu của đơn hàng đã phát sinh có thể phải được giữ lại theo luật. Gửi yêu cầu qua trang Liên hệ.
info.privacy.s6.h=Quyền của bạn
info.privacy.s7.b=Chính sách này mô tả cách hệ thống đang hoạt động, nhưng chưa được luật sư rà soát. Cửa hàng cần kiểm tra và bổ sung thông tin pháp nhân, địa chỉ, đầu mối xử lý dữ liệu trước khi chính thức vận hành.
info.privacy.s7.h=Lưu ý
info.privacy.title=Chính sách bảo mật
info.returns.eyebrow=HỖ TRỢ KHÁCH HÀNG
info.returns.lede=Đổi ý? Chúng tôi giúp bạn việc đó thật đơn giản.
info.returns.s1.b=Sản phẩm chưa sử dụng, còn nguyên tem mác có thể trả trong vòng @@RETURN_DAYS@@ ngày kể từ khi nhận hàng. Bạn gửi yêu cầu ngay tại mục Đơn hàng của tôi (đơn đã giao thành công), cửa hàng sẽ duyệt và hướng dẫn gửi hàng về.
info.returns.s1.h=Đổi trả trong @@RETURN_DAYS@@ ngày
info.returns.s2.b=Nếu sản phẩm bị hư hỏng hoặc lỗi, hãy liên hệ kèm hình ảnh, chúng tôi sẽ đổi sản phẩm mới miễn phí.
info.returns.s2.h=Sản phẩm lỗi
info.returns.s3.b=Khoản hoàn tiền được chuyển về phương thức thanh toán ban đầu trong 5–7 ngày làm việc.
info.returns.s3.h=Hoàn tiền
info.returns.title=Đổi trả & hoàn tiền
info.shipping.eyebrow=HỖ TRỢ KHÁCH HÀNG
info.shipping.lede=Đơn hàng KOSIS đến tay bạn như thế nào và khi nào.
info.shipping.s1.b=Đơn hàng được chuẩn bị trong 1–2 ngày làm việc. Giao hàng tiêu chuẩn mất 2–4 ngày làm việc trên toàn quốc.
info.shipping.s1.h=Thời gian giao hàng
info.shipping.s2.b=Phí vận chuyển và mức đơn hàng được miễn phí vận chuyển hiển thị ở giỏ hàng và trang thanh toán trước khi bạn đặt hàng.
info.shipping.s2.h=Phí vận chuyển
info.shipping.s3.b=Khi bưu kiện rời kho, chúng tôi sẽ liên hệ theo số điện thoại bạn cung cấp lúc thanh toán.
info.shipping.s3.h=Theo dõi đơn hàng
info.shipping.title=Thông tin vận chuyển
info.terms.eyebrow=VỀ KOSIS
info.terms.lede=Những quy định khi mua sắm tại KOSIS.
info.terms.s1.b=Khi tạo tài khoản hoặc đặt hàng tại KOSIS, bạn đồng ý với các điều khoản này, Chính sách bảo mật và chính sách Đổi trả & hoàn tiền. Bạn cần cung cấp thông tin chính xác và chịu trách nhiệm về các hoạt động diễn ra trong tài khoản của mình, kể cả việc giữ bí mật mật khẩu.
info.terms.s1.h=Chấp nhận điều khoản
info.terms.s2.b=Việc gửi đơn là đề nghị mua hàng. Đơn chỉ được xem là đã chấp nhận khi nhân viên xác nhận: với chuyển khoản là sau khi kiểm tra bill và tiền đã về tài khoản; với thanh toán khi nhận hàng (COD) là sau khi cửa hàng kiểm tra tiền cọc đã về tài khoản và xác nhận đơn. Chúng tôi có thể từ chối hoặc hủy đơn (ví dụ hết hàng, thông tin giao hàng không hợp lệ, không xác nhận được thanh toán, nghi ngờ gian lận) và sẽ thông báo lý do; nếu bạn đã chuyển khoản, cửa hàng sẽ liên hệ để hoàn tiền. Bạn có thể tự hủy đơn khi đơn còn đang chờ xác nhận.
info.terms.s2.h=Đặt hàng và xác nhận
info.terms.s3.b=Giá hiển thị bằng đồng Việt Nam (₫). Phí vận chuyển và mã giảm giá được tính và hiển thị ở giỏ hàng, trang thanh toán trước khi bạn đặt hàng. Mã giảm giá có điều kiện, thời hạn và số lượt dùng riêng, không quy đổi thành tiền mặt. Nếu có sai sót rõ ràng về giá, chúng tôi có thể điều chỉnh hoặc hủy đơn trước khi xác nhận và thông báo cho bạn. Với chuyển khoản, bạn cần nhập đúng số tiền và nội dung được hướng dẫn.
info.terms.s3.h=Giá bán và thanh toán
info.terms.s4.b=Thời gian giao hàng chỉ là ước tính. Bạn cần cung cấp đúng số điện thoại, địa chỉ và nghe máy khi đơn vị vận chuyển liên hệ. Khi hàng đã giao tới, bạn xác nhận "Tôi đã nhận được hàng" ở mục Đơn hàng của tôi; nếu sau số ngày quy định bạn không phản hồi, hệ thống tự chuyển đơn sang đã giao thành công. Việc nhiều lần từ chối nhận hàng sẽ được ghi nhận và cửa hàng có thể cân nhắc khi xử lý các đơn sau.
info.terms.s4.h=Giao hàng và nhận hàng
info.terms.s5.b=Việc đổi trả tuân theo chính sách Đổi trả & hoàn tiền: gửi yêu cầu trong thời hạn quy định kể từ khi nhận hàng, sản phẩm chưa sử dụng và còn nguyên tem mác, trừ trường hợp sản phẩm lỗi do cửa hàng.
info.terms.s5.h=Đổi trả và hoàn tiền
info.terms.s6.b=Bạn không được dùng website để gian lận thanh toán (như tải bill giả), dò mật khẩu hoặc truy cập trái phép tài khoản khác, tạo tài khoản hàng loạt, gây quá tải hệ thống hoặc đăng đánh giá giả mạo, xúc phạm. Chúng tôi có quyền khóa tài khoản và từ chối đơn khi phát hiện vi phạm.
info.terms.s6.h=Hành vi bị cấm
info.terms.s7.b=Hình ảnh, nội dung và thương hiệu trên website thuộc quyền của KOSIS hoặc bên cấp phép, không được sao chép hay dùng cho mục đích thương mại khi chưa được đồng ý bằng văn bản. Đánh giá bạn gửi có thể được hiển thị công khai trên trang sản phẩm.
info.terms.s7.h=Nội dung và quyền sở hữu trí tuệ
info.terms.s8.b=Trong phạm vi pháp luật cho phép, KOSIS không chịu trách nhiệm cho thiệt hại gián tiếp phát sinh từ việc gián đoạn website ngoài khả năng kiểm soát của chúng tôi; điều này không làm mất các quyền của người tiêu dùng theo luật. Chúng tôi có thể cập nhật điều khoản; đơn đã xác nhận trước đó áp dụng điều khoản tại thời điểm đặt hàng. Tranh chấp được ưu tiên giải quyết qua thương lượng, nếu không được thì giải quyết tại tòa án có thẩm quyền của Việt Nam.
info.terms.s8.h=Giới hạn trách nhiệm và thay đổi điều khoản
info.terms.s9.b=Điều khoản này mô tả cách cửa hàng đang vận hành nhưng chưa được luật sư rà soát. Cửa hàng cần kiểm tra và bổ sung thông tin pháp nhân, mã số thuế, địa chỉ trước khi chính thức vận hành.
info.terms.s9.h=Lưu ý
info.terms.title=Điều khoản & điều kiện

