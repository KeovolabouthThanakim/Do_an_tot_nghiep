spring.application.name=kosis

# ==========================================================
# BI MAT: KHONG ghi mat khau / so tai khoan that vao file nay (file nay duoc dua len Git).
# Dat bang bien moi truong (xem .env.example) HOAC tao file ./local.properties ngay canh noi chay app
# (file nay da nam trong .gitignore), vi du:
#     spring.datasource.password=...
#     shop.bank.account-number=...
#     shop.bank.account-name=...
# Gia tri trong local.properties se de len gia tri mac dinh o duoi.
# ==========================================================
spring.config.import=optional:file:./local.properties
spring.thymeleaf.cache=false
# ==========================================================
# DA NGON NGU (vi / en)
# messages.properties = tieng Viet (mac dinh), messages_en.properties = tieng Anh.
# Doi ngon ngu: ?lang=en | ?lang=vi (luu trong cookie "kosis-lang"). Trang /dashboard/** luon tieng Viet.
# always-use-message-format: moi thong bao di qua MessageFormat => dau nhay don viet '' va tham so la {0}, {1}...
# ==========================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.always-use-message-format=true


# Cache-busting cho CSS/JS/ảnh: URL được gắn mã băm nội dung (vd. style-3fa9c1.css),
# nên sửa file là trình duyệt tự tải bản mới, không còn bị kẹt giao diện cũ.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/images/**
server.port=8080

# ==========================================================
# SESSION / COOKIE (gio hang va dang nhap deu nam trong session)
# http-only: JavaScript khong doc duoc cookie phien -> han che bi danh cap khi co loi XSS
# same-site=lax: trinh duyet khong gui cookie kem request POST tu trang web khac -> giam nguy co CSRF
# tracking-modes=cookie: khong cho ma phien (;jsessionid=...) xuat hien tren URL
# Cookie "secure" (chi gui qua HTTPS) duoc bat o profile prod - xem application-prod.properties
# ==========================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ==========================================================
# BAO MAT (xem SecurityConfig.java)
# require-https: true = chuyen moi request http -> https (CHI bat khi chay sau reverse proxy co TLS; da bat san o profile prod)
# csp.report-only: true = Content-Security-Policy chi bao loi trong Console trinh duyet, KHONG chan
#                  (dung de thu truoc neu them CDN / script moi; sau do doi lai false)
# ==========================================================
kosis.security.require-https=false
kosis.security.csp.report-only=false

# ==========================================================
# KET NOI DATABASE (MySQL)
# Doi lai host/port/ten-database/username/password cho dung
# voi may cua ban (vi du dung XAMPP thi user mac dinh la root,
# password de trong "").
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/kosis?useSSL=false&serverTimezone=Asia/Bangkok&createDatabaseIfNotExist=true
spring.datasource.username=${KOSIS_DB_USERNAME:root}
spring.datasource.password=${KOSIS_DB_PASSWORD:}

# update: tu tao/cap nhat bang theo Entity (User.java) khi chay app,
# khong xoa du lieu cu -> phu hop khi dang phat trien.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# UPLOAD ẢNH SẢN PHẨM (trang quản trị /dashboard/kho-hang)
# Ảnh được lưu ở thư mục "uploads/products" (ngoài classpath,
# nằm cạnh nơi chạy jar/app) và phục vụ qua URL /uploads/**
# (xem WebConfig.java)
# ==========================================================
spring.servlet.multipart.max-file-size=5MB
# Mỗi sản phẩm tối đa 3 ảnh x 5MB -> cho phép request tới 15MB
spring.servlet.multipart.max-request-size=15MB

# ==========================================================
# TÀI KHOẢN NGÂN HÀNG NHẬN TIỀN (hiện mã QR ở trang thanh toán)
# !!! ĐỔI thành thông tin THẬT của cửa hàng trước khi chạy thật !!!
# bank-id: mã ngân hàng theo VietQR, VD: VCB, MB, TCB, ACB, BIDV, VPB, TPB, ICB, STB
# qr-image: (không bắt buộc) đường dẫn ảnh QR tự đặt, VD /images/bank-qr.png
#           để trống = tự tạo QR VietQR có sẵn số tiền + nội dung chuyển khoản của từng đơn
# ==========================================================
shop.bank.bank-id=ICB
# bin: mã BIN 6 số của ngân hàng (không bắt buộc - để trống thì tự tra theo bank-id). VietinBank = 970415 (bank-id ICB)
shop.bank.bin=970415
shop.bank.bank-name=VietinBank
# So tai khoan + ten chu tai khoan: dat bien moi truong KOSIS_BANK_ACCOUNT_NUMBER / KOSIS_BANK_ACCOUNT_NAME
# (hoac trong local.properties). De trong = khong tao ma QR va app se in canh bao khi khoi dong.
shop.bank.account-number=${KOSIS_BANK_ACCOUNT_NUMBER:}
shop.bank.account-name=${KOSIS_BANK_ACCOUNT_NAME:}
shop.bank.qr-image=

# ==========================================================
# DOI SOAT CHUYEN KHOAN TU DONG (webhook, dinh dang SePay / Casso)
# Dich vu doi soat goi POST /api/payment/webhook khi tien ve tai khoan; khop dung 1 don chuyen khoan dang cho kiem tra
# (dung so tien + noi dung co ma don hoac "KS ten-tai-khoan") thi don tu duoc xac nhan.
# Gui kem header "Authorization: Apikey <khoa>". De trong = tat webhook, nhan vien xac nhan tay nhu cu.
# ==========================================================
shop.payment.webhook-key=${KOSIS_PAYMENT_WEBHOOK_KEY:}

# ==========================================================
# ADMIN MAC DINH
# Neu trong he thong CHUA co tai khoan ADMIN nao, app tu tao 1 tai khoan khi khoi dong.
# Mat khau KHONG de trong code: dat bien moi truong KOSIS_ADMIN_PASSWORD (it nhat 6 ky tu).
# De trong = app tu sinh mat khau ngau nhien va in ra console 1 lan (hay doi ngay sau khi dang nhap).
# ==========================================================
kosis.admin.username=admin
kosis.admin.password=${KOSIS_ADMIN_PASSWORD:}

# ==========================================================
# GIAO HANG: TU HOAN TAT DON KHI KHACH KHONG PHAN HOI
# Khi van chuyen bao da giao toi khach, khach co the bam "Toi da nhan duoc hang" o trang "Don hang cua toi".
# Qua so ngay duoi day ma khach khong bam gi thi he thong tu chuyen don sang "Da giao thanh cong".
# Khuyen dung 3-7 ngay (COD nen de ngan, hang gia tri cao nen de dai hon).
# ==========================================================
kosis.shipping.auto-complete-days=5
# Chu ky kiem tra (mili-giay), mac dinh 1 gio:
#kosis.shipping.auto-check-ms=3600000

# ==========================================================
# EMAIL (quen mat khau, thong bao don hang, chao mung newsletter)
# Chua cau hinh SMTP thi noi dung email chi duoc IN RA CONSOLE (khong gui that) - tien cho luc phat trien.
# Muon gui that: dat cac gia tri duoi day trong local.properties (hoac bien moi truong SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD). KHONG dien san spring.mail.host o day de che do console hoat dong.
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=ban@gmail.com
#   spring.mail.password=<mat-khau-ung-dung>      (Gmail: dung "Mat khau ung dung", khong dung mat khau dang nhap)
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
# Dia chi nguoi gui hien thi (de trong = dung spring.mail.username):
kosis.mail.from=${KOSIS_MAIL_FROM:}
# Dia chi website that, dung de tao link trong email (VD https://kosis.vn). Mac dinh cho may dev:
kosis.base-url=${KOSIS_BASE_URL:http://localhost:8080}

# ==========================================================
# TRANG LIEN HE (/contact)
# Thong tin hien thi o trang lien he - !!! DOI thanh thong tin THAT truoc khi chay that !!!
# Tin nhan khach gui luon duoc luu vao database (xem o /dashboard/lien-he).
# (Chu Viet co dau trong file nay phai viet dang \uXXXX, neu khong se bi loi font)
# notify-email: neu dien, moi tin nhan moi se duoc gui email bao den dia chi nay (can cau hinh SMTP o tren).
# ==========================================================
kosis.contact.email=${KOSIS_CONTACT_EMAIL:hello@kosis.example}
kosis.contact.phone=${KOSIS_CONTACT_PHONE:1900 1234}
kosis.contact.hours=Th\u1ee9 2 \u2013 Th\u1ee9 7, 9:00\u201318:00
kosis.contact.address=123 \u0111\u01b0\u1eddng Atelier, Qu\u1eadn 1, TP. H\u1ed3 Ch\u00ed Minh
kosis.contact.notify-email=${KOSIS_CONTACT_NOTIFY_EMAIL:}

# ==========================================================
# PHI VAN CHUYEN (khach tra) - tinh tren tien hang SAU giam gia
# fee = phi co dinh moi don (0 = mien phi moi don); free-threshold = tu muc nay tro len thi MIEN PHI (0 = khong bao gio mien phi)
# ==========================================================
# Dat coc don COD: khach chon COD phai chuyen khoan truoc % gia tri don (lam tron len 1.000d), phan con lai tra khi nhan hang.
# 0 = tat (COD khong can coc). ADMIN co the doi tren /dashboard/cai-dat. Khuyen dung 30 (50 voi hang gia tri cao / khach hay bom hang).
shop.cod.deposit-percent=30
shop.shipping.fee=30000
shop.shipping.free-threshold=500000

# Số ngày khách được gửi yêu cầu trả hàng kể từ lúc nhận hàng
kosis.returns.window-days=7

# Số sản phẩm mỗi trang ở trang danh sách / tìm kiếm.
# Nên chọn số CHIA HẾT cho số cột của lưới (xem css/kosis/shop.css: 5 cột > 1280px, 4 cột <= 1280px, 3 cột <= 1100px, 2 cột <= 600px)
# để hàng cuối không bị hụt ô: 20 vừa với 5, 4 và 2 cột (15 vừa với 5 và 3 cột; 60 vừa với cả 5/4/3/2).
# Lưu ý: nếu ADMIN đã lưu giá trị ở /dashboard/cai-dat thì giá trị đó ghi đè dòng này.
kosis.listing.page-size=20

# ==========================================================
# CAI DAT HE THONG (/dashboard/cai-dat)
# Cai dat duoc giu trong bo nho va tu nap lai tu database sau moi so giay duoi day, de khi chay NHIEU may chu
# thi may khac sua cai dat, may nay cung tu cap nhat. 0 = tat (chi nap luc khoi dong va sau khi luu tren may nay).
# ==========================================================
kosis.settings.refresh-seconds=30

# ==========================================================
# GIOI HAN SO LAN THU o trang dang nhap / dang ky (rate limit, luu trong bo nho)
# login: chi dem lan SAI mat khau. max-per-user = moi cap (IP + ten dang nhap); max-per-ip = tong cua 1 IP.
# register: dem moi lan gui form dang ky cua 1 IP.
# Chay sau reverse proxy (nginx...) thi them: server.forward-headers-strategy=native de nhan dung IP khach.
# ==========================================================
kosis.security.rate-limit.login.max-per-user=5
kosis.security.rate-limit.login.max-per-ip=20
kosis.security.rate-limit.login.window-seconds=600
kosis.security.rate-limit.register.max-per-ip=5
kosis.security.rate-limit.register.window-seconds=3600

# ==========================================================
# HOA DON BAN HANG (in tren /thanh-toan/hoa-don/{id} khi don da xac nhan, va gui link trong email xac nhan don)
# !!! DOI thanh thong tin THAT cua cua hang. De trong seller-tax-code = khong in ma so thue.
# seller-address de trong = dung kosis.contact.address.
# ==========================================================
kosis.invoice.seller-name=${KOSIS_INVOICE_SELLER_NAME:KOSIS}
kosis.invoice.seller-tax-code=${KOSIS_INVOICE_TAX_CODE:}
kosis.invoice.seller-address=${KOSIS_INVOICE_ADDRESS:${kosis.contact.address}}
