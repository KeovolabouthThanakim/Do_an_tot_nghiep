# ==========================================================
# PROFILE PRODUCTION  -  chay bang:
#     java -jar target/kosis-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
# hoac dat bien moi truong SPRING_PROFILES_ACTIVE=prod
#
# File nay chi GHI DE nhung gia tri khac voi application.properties (dev).
# Moi bi mat dat bang BIEN MOI TRUONG tren server. Khong dua local.properties len server.
# Cac bien KHONG co gia tri mac dinh duoi day la BAT BUOC: thieu bien nao app bao loi ngay luc khoi dong
# ("Could not resolve placeholder ...") thay vi chay voi cau hinh sai.
# ==========================================================

# ----- Database: bat buoc khai bao day du, khong dung root / mat khau rong -----
# Vi du KOSIS_DB_URL=jdbc:mysql://db-host:3306/kosis?serverTimezone=Asia/Bangkok&sslMode=REQUIRED
# (khong co createDatabaseIfNotExists: database phai duoc tao san - xem data_base/kosis_schema.sql)
spring.datasource.url=${KOSIS_DB_URL}
spring.datasource.username=${KOSIS_DB_USERNAME}
spring.datasource.password=${KOSIS_DB_PASSWORD}

# validate: chi KIEM TRA bang/cot khop voi Entity, KHONG tu sua database. Lech la app dung ngay luc khoi dong
# va bao ro thieu bang/cot nao. Khi Entity doi, phai sua database bang script SQL (hoac dung Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----- Giao dien -----
spring.thymeleaf.cache=true
# Phong khi chay bang "mvn spring-boot:run" (devtools co tren classpath): tat restart/livereload va cac gia tri dev mac dinh.
# (Chay bang "java -jar" thi devtools da tu bi loai khoi file jar.)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false

# ----- HTTPS + cookie -----
# Sau reverse proxy (nginx, Caddy, Cloudflare...) co TLS. Proxy PHAI ghi de header X-Forwarded-For / X-Forwarded-Proto
# (neu khong khach co the gia IP de ne gioi han dang nhap).
server.forward-headers-strategy=native
kosis.security.require-https=true
# Cookie phien chi gui qua HTTPS (khong bat o dev vi localhost chay http)
server.servlet.session.cookie.secure=true

# ----- Khong lo thong tin noi bo ra trang loi -----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ----- Van hanh -----
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# ----- Dia chi website that, dung tao link trong email (bat buoc, khong de localhost) -----
kosis.base-url=${KOSIS_BASE_URL}
