# ---- info ----
info.faq.eyebrow=CUSTOMER SERVICE
info.faq.lede=Quick answers to the questions we receive most often.
info.faq.s1.b=You can pay in full by bank transfer (scan the QR code at checkout and upload your payment slip) or choose cash on delivery (COD). For COD you first transfer a deposit of part of the order value (the amount is shown at checkout) and pay the rest to the courier on delivery. If you refuse the parcel without a valid reason, the deposit will not be refunded.
info.faq.s1.h=How do I pay?
info.faq.s2.b=Our staff check your payment slip and confirm the order. You can follow the status under My orders.
info.faq.s2.h=When is a bank transfer order confirmed?
info.faq.s3.b=The product page lists the sizes in stock. If you are between two sizes, we recommend sizing up for jackets.
info.faq.s3.h=How do I choose a size?
info.faq.s4.b=You can browse products and add them to your cart without signing in. An account is required at checkout so that you can track your order.
info.faq.s4.h=Do I need an account?
info.faq.title=Frequently asked questions
info.our-story.eyebrow=ABOUT KOSIS
info.our-story.lede=A small brand with a long-term view of what we wear.
info.our-story.s1.b=KOSIS started from a simple idea: clothes should be refined, not loud. We design with a neutral palette and natural materials so that every piece is easy to pair with your wardrobe.
info.our-story.s1.h=Why KOSIS
info.our-story.s2.b=We choose materials carefully, keep our collection small and work with craftspeople who share that patience.
info.our-story.s2.h=How we work
info.our-story.s3.b=More designs for more people, but always with the thought of owning less, and better.
info.our-story.s3.h=What we aim for
info.our-story.title=Our story
info.privacy.eyebrow=ABOUT KOSIS
info.privacy.lede=What information we collect, what we use it for and how you control it.
info.privacy.s1.b=Account: username, password (one-way encrypted, not visible to staff), full name, email, phone number, address. Orders: recipient, phone number, delivery address, notes, items purchased, payment method and the payment slip you upload. Also: messages you send on the Contact page, email addresses for the newsletter, product reviews, return requests and your wishlist when you are signed in.
info.privacy.s1.h=Information we collect
info.privacy.s2.b=Processing, delivering and supporting orders; confirming payments; issuing invoices; handling returns and refunds; replying to enquiries; sending emails about orders and password resets. Newsletter emails are only used to send information about new collections once you have subscribed. We do not sell your personal information.
info.privacy.s2.h=How we use it
info.privacy.s3.b=The carrier receives your name, phone number and delivery address to deliver your order. For bank transfer orders, the QR code is generated through the VietQR service (img.vietqr.io), so the receiving account number, amount and transfer note of the order are sent to that service. Emails are sent through the mail provider configured by the store. The website loads fonts from Google Fonts and icons from jsDelivr, so these services may receive your IP address. We may also disclose information when a competent authority requests it under the law.
info.privacy.s3.h=Sharing with third parties
info.privacy.s4.b=The website uses session cookies (sign-in, cart) and a security cookie that protects against form forgery; these cookies are necessary for the website to work. Some display settings may be stored in your browser''s memory. Your IP address is used temporarily to limit abnormal sign-in/sign-up attempts and prevent password guessing, and is not stored long-term.
info.privacy.s4.h=Cookies and data stored in your browser
info.privacy.s5.b=Passwords are encrypted, payment slips are stored in a non-public area and can only be viewed by the order owner or authorized staff. Order data is kept for as long as needed to process orders, provide warranty, handle returns and meet accounting and tax obligations. No system is completely secure; if we discover an incident involving your data, we will notify you as required by law.
info.privacy.s5.h=Storage and security
info.privacy.s6.b=You can view and update your full name, email, phone number and address under My account, and contact us (including to unsubscribe from the newsletter) to request access, correction, restriction of processing or deletion of your data, or to withdraw your consent, in accordance with Vietnamese personal data protection law (Decree 13/2023/ND-CP). Some data of orders that have already been placed may have to be retained by law. Send your request through the Contact page.
info.privacy.s6.h=Your rights
info.privacy.s7.b=This policy describes how the system currently works but has not been reviewed by a lawyer. The store needs to check and add its legal entity details, address and data-protection contact before going live.
info.privacy.s7.h=Please note
info.privacy.title=Privacy policy
info.returns.eyebrow=CUSTOMER SERVICE
info.returns.lede=Changed your mind? We make it simple.
info.returns.s1.b=Unused items with original tags attached can be returned within @@RETURN_DAYS@@ days of delivery. Submit a request under My orders (for successfully delivered orders); the store will review it and tell you how to send the goods back.
info.returns.s1.h=Returns within @@RETURN_DAYS@@ days
info.returns.s2.b=If an item arrives damaged or defective, contact us with photos and we will replace it with a new one free of charge.
info.returns.s2.h=Defective items
info.returns.s3.b=Refunds are sent back to the original payment method within 5–7 business days.
info.returns.s3.h=Refunds
info.returns.title=Returns & refunds
info.shipping.eyebrow=CUSTOMER SERVICE
info.shipping.lede=How and when your KOSIS order reaches you.
info.shipping.s1.b=Orders are prepared within 1–2 business days. Standard delivery takes 2–4 business days nationwide.
info.shipping.s1.h=Delivery time
info.shipping.s2.b=Shipping fees and the order value for free shipping are shown in your cart and at checkout before you place your order.
info.shipping.s2.h=Shipping fees
info.shipping.s3.b=Once your parcel leaves our warehouse, we will contact you at the phone number you provided at checkout.
info.shipping.s3.h=Order tracking
info.shipping.title=Shipping information
info.terms.eyebrow=ABOUT KOSIS
info.terms.lede=The rules for shopping at KOSIS.
info.terms.s1.b=By creating an account or placing an order at KOSIS, you agree to these terms, the Privacy policy and the Returns & refunds policy. You must provide accurate information and are responsible for activity in your account, including keeping your password confidential.
info.terms.s1.h=Acceptance of terms
info.terms.s2.b=Submitting an order is an offer to buy. An order is only accepted once our staff confirm it: for bank transfers, after the payment slip is checked and the money has arrived; for cash on delivery (COD), after the store checks that the deposit has arrived and confirms the order. We may decline or cancel an order (for example out of stock, invalid delivery details, payment cannot be verified, suspected fraud) and will tell you why; if you have already paid by transfer, the store will contact you to refund it. You can cancel an order yourself while it is still awaiting confirmation.
info.terms.s2.h=Orders and confirmation
info.terms.s3.b=Prices are shown in Vietnamese dong (₫). Shipping fees and discount codes are calculated and shown in your cart and at checkout before you place an order. Discount codes have their own conditions, validity period and usage limits, and cannot be exchanged for cash. If there is an obvious pricing error, we may adjust or cancel the order before confirmation and notify you. For bank transfers, you must enter the exact amount and transfer note given.
info.terms.s3.h=Prices and payment
info.terms.s4.b=Delivery times are estimates only. You must provide the correct phone number and address and answer when the carrier calls. Once the goods have been delivered, you confirm "I have received my order" under My orders; if you do not respond within the set number of days, the system automatically marks the order as delivered. Repeated refusals to accept delivery are recorded and the store may take them into account for later orders.
info.terms.s4.h=Delivery and receipt
info.terms.s5.b=Returns follow the Returns & refunds policy: submit a request within the stated period after receiving the goods, with the item unused and original tags attached, unless the item is defective due to the store.
info.terms.s5.h=Returns and refunds
info.terms.s6.b=You may not use the website to commit payment fraud (such as uploading fake payment slips), guess passwords or access other accounts without permission, create accounts in bulk, overload the system or post fake or abusive reviews. We have the right to lock accounts and refuse orders when violations are found.
info.terms.s6.h=Prohibited conduct
info.terms.s7.b=Images, content and trademarks on the website belong to KOSIS or its licensors and may not be copied or used commercially without written consent. Reviews you submit may be displayed publicly on product pages.
info.terms.s7.h=Content and intellectual property
info.terms.s8.b=To the extent permitted by law, KOSIS is not liable for indirect damages arising from website interruptions beyond our control; this does not affect your statutory consumer rights. We may update these terms; orders confirmed earlier are governed by the terms at the time of ordering. Disputes are preferably resolved through negotiation, otherwise before a competent court in Vietnam.
info.terms.s8.h=Limitation of liability and changes to terms
info.terms.s9.b=These terms describe how the store currently operates but have not been reviewed by a lawyer. The store needs to check and add its legal entity details, tax code and address before going live.
info.terms.s9.h=Please note
info.terms.title=Terms & conditions

