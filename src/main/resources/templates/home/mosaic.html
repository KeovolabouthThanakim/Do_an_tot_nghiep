<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ============================================================
     FRAGMENT: asymmetric editorial product grid (one tab of "KOSIS SEASONS")
     params: list = products, m1/m2/m3 = model photo paths, links = target pages for the 3 photos, alts = alt texts
     Tiles t1..t12 and photos m1..m3 are placed on a 5-column grid in /css/kosis/home.css
     ============================================================ -->
<div class="mosaic" th:fragment="mosaic(list, m1, m2, m3, link, label)" th:classappend="${#lists.size(list) <= 8} ? 'mosaic--short'">
    <a class="look m1" th:href="@{${link}}" th:if="${m1 != null}">
        <img th:src="@{${m1}}" th:alt="#{home.mosaic.alt(${label})}" loading="lazy">
        <span class="look__cap">[[#{home.shop.the.full.look}]] <i class="bi bi-arrow-up-right"></i></span>
    </a>
    <a class="look m2" th:href="@{${link}}" th:if="${m2 != null and #lists.size(list) > 8}">
        <img th:src="@{${m2}}" th:alt="#{home.mosaic.alt(${label})}" loading="lazy">
        <span class="look__cap">[[#{home.shop.the.full.look}]] <i class="bi bi-arrow-up-right"></i></span>
    </a>
    <a class="look m3" th:href="@{${link}}" th:if="${m3 != null and #lists.size(list) > 8}">
        <img th:src="@{${m3}}" th:alt="#{home.mosaic.alt(${label})}" loading="lazy">
        <span class="look__cap">[[#{home.shop.the.full.look}]] <i class="bi bi-arrow-up-right"></i></span>
    </a>
    <th:block th:each="p, st : ${list}">
        <th:block th:if="${st.count <= 12}">
            <th:block th:replace="~{fragments/layout :: productCard(${p}, ${'tile t' + st.count})}"></th:block>
        </th:block>
    </th:block>
</div>
</body>
</html>
