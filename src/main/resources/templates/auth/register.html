<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head('Đăng ký | KOSIS', 'pages')}"></head>
<body>
<main id="main" class="auth-page">
<div class="auth">
        <div class="auth__art">
            <img th:src="@{/images/collections/model-beige-coat-street.jpg}" alt="">
            <div><h2>Tham gia<br>cộng đồng.</h2><p>Lưu thông tin, theo dõi mọi đơn hàng và là người đầu tiên xem bộ sưu tập mới.</p></div>
        </div>
        <div class="auth__form">
            <a class="auth__logo" th:href="@{/}" aria-label="Trang chủ KOSIS">KOSIS</a>
            <a class="auth__back" th:href="@{/}"><i class="bi bi-arrow-left"></i> Về trang chủ</a>
            <div class="auth-box" style="max-width:460px">
                <h1>Tạo tài khoản</h1>
                <p class="auth-subtitle">Chỉ mất một phút để tạo tài khoản.</p>
                <div hidden data-flash="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <form th:action="@{/register}" th:object="${user}" method="post">
                    <div class="auth-grid">
                        <div class="field full"><label for="fullName">Họ và tên</label><input type="text" id="fullName" th:field="*{fullName}" autocomplete="name" required></div>
                        <div class="field"><label for="username">Tên đăng nhập</label><input type="text" id="username" th:field="*{username}" autocomplete="username" required></div>
                        <div class="field"><label for="phone">Số điện thoại</label><input type="tel" id="phone" th:field="*{phone}" autocomplete="tel" placeholder="09xxxxxxxx" pattern="[0-9+ .\-]{9,16}" required></div>
                        <div class="field full"><label for="email">Email</label><input type="email" id="email" th:field="*{email}" autocomplete="email" required></div>
                        <div class="field full"><label for="address">Địa chỉ</label><input type="text" id="address" th:field="*{address}" autocomplete="street-address" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành" required></div>
                        <div class="field full"><label for="password">Mật khẩu</label><input type="password" id="password" th:field="*{password}" minlength="6" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" required></div>
                    </div>
                    <button type="submit" class="btn btn--dark btn--block" style="height:50px;margin-top:6px">Tạo tài khoản</button>
                </form>
                <p class="auth-switch">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
            </div>
        </div>
</div>
</main>
</body>
</html>
