<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head(#{title.register}, 'pages')}"></head>
<body>
<main id="main" class="auth-page">
<div class="auth">
        <div class="auth__art">
            <img th:src="@{/images/collections/model-beige-coat-street.jpg}" alt="">
            <div><h2>[[#{auth.join.the}]]<br>[[#{auth.community}]]</h2><p>[[#{auth.save.your.details.track.every}]]</p></div>
        </div>
        <div class="auth__form">
            <a class="auth__logo" th:href="@{/}" aria-label="Trang chủ KOSIS" th:aria-label="#{common.kosis.home.page}">KOSIS</a>
            <a class="auth__back" th:href="@{/}"><i class="bi bi-arrow-left"></i> [[#{auth.back.to.home}]]</a>
            <div class="auth-box" style="max-width:460px">
                <h1>[[#{common.create.account}]]</h1>
                <p class="auth-subtitle">[[#{auth.it.only.takes.a.minute}]]</p>
                <div hidden data-flash="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <form th:action="@{/register}" th:object="${user}" method="post">
                    <div class="auth-grid">
                        <div class="field full"><label for="fullName">[[#{common.full.name}]]</label><input type="text" id="fullName" th:field="*{fullName}" autocomplete="name" required></div>
                        <div class="field"><label for="username">[[#{auth.username}]]</label><input type="text" id="username" th:field="*{username}" autocomplete="username" required></div>
                        <div class="field"><label for="phone">[[#{common.phone.number}]]</label><input type="tel" id="phone" th:field="*{phone}" autocomplete="tel" placeholder="09xxxxxxxx" pattern="[0-9+ .\-]{9,16}" required></div>
                        <div class="field full"><label for="email">Email</label><input type="email" id="email" th:field="*{email}" autocomplete="email" required></div>
                        <div class="field full"><label for="address">[[#{auth.address}]]</label><input type="text" id="address" th:field="*{address}" autocomplete="street-address" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành" th:placeholder="#{common.house.number.street.ward.district}" required></div>
                        <div class="field full"><label for="password">[[#{auth.password}]]</label><input type="password" id="password" th:field="*{password}" minlength="6" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" th:placeholder="#{auth.at.least.6.characters}" required></div>
                    </div>
                    <button type="submit" class="btn btn--dark btn--block" style="height:50px;margin-top:6px">[[#{common.create.account}]]</button>
                </form>
                <p class="auth-switch">[[#{auth.already.have.an.account}]] <a th:href="@{/login}">[[#{common.sign.in}]]</a></p>
            </div>
        </div>
</div>
</main>
</body>
</html>
