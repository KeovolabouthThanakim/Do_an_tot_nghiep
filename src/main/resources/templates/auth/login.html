<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head('Đăng nhập | KOSIS', 'pages')}"></head>
<body>
<main id="main" class="auth-page">
<div class="auth">
        <div class="auth__art">
            <img th:src="@{/images/collections/womens-fashion-portrait.jpg}" alt="">
            <div><h2>Chào mừng<br>trở lại.</h2><p>Đăng nhập để theo dõi đơn hàng, lưu thông tin và thanh toán nhanh hơn.</p></div>
        </div>
        <div class="auth__form">
            <a class="auth__logo" th:href="@{/}" aria-label="Trang chủ KOSIS">KOSIS</a>
            <a class="auth__back" th:href="@{/}"><i class="bi bi-arrow-left"></i> Về trang chủ</a>
            <div class="auth-box">
                <h1>Đăng nhập</h1>
                <p class="auth-subtitle">Nhập thông tin của bạn để tiếp tục.</p>
                <div hidden data-flash="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <div hidden data-flash="success" th:if="${successMessage}" th:text="${successMessage}"></div>
                <div hidden data-flash="success" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>
                <div hidden data-flash="info" th:if="${infoMessage}" th:text="${infoMessage}"></div>
                <form th:action="@{/login}" method="post">
                    <div class="field"><label for="username">Tên đăng nhập hoặc email</label><input type="text" id="username" name="username" autocomplete="username" placeholder="username hoặc email@example.com" required></div>
                    <div class="field"><label for="password">Mật khẩu</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
                    <div class="auth-options"><label><input type="checkbox" name="remember-me"> Ghi nhớ đăng nhập</label> <a th:href="@{/forgot-password}">Quên mật khẩu?</a></div>
                    <button type="submit" class="btn btn--dark btn--block" style="height:50px">Đăng nhập</button>
                </form>
                <p class="auth-switch">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
            </div>
        </div>
</div>
</main>
</body>
</html>
