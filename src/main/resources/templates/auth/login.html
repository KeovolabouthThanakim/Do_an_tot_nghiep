<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head(#{title.login}, 'pages')}"></head>
<body>
<main id="main" class="auth-page">
<div class="auth">
        <div class="auth__art">
            <img th:src="@{/images/collections/womens-fashion-portrait.jpg}" alt="">
            <div><h2>[[#{auth.welcome}]]<br>[[#{auth.back}]]</h2><p>[[#{auth.sign.in.to.track.your}]]</p></div>
        </div>
        <div class="auth__form">
            <a class="auth__logo" th:href="@{/}" aria-label="Trang chủ KOSIS" th:aria-label="#{common.kosis.home.page}">KOSIS</a>
            <a class="auth__back" th:href="@{/}"><i class="bi bi-arrow-left"></i> [[#{auth.back.to.home}]]</a>
            <div class="auth-box">
                <h1>[[#{common.sign.in}]]</h1>
                <p class="auth-subtitle">[[#{auth.enter.your.details.to.continue}]]</p>
                <div hidden data-flash="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <div hidden data-flash="success" th:if="${successMessage}" th:text="${successMessage}"></div>
                <div hidden data-flash="success" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>
                <div hidden data-flash="info" th:if="${infoMessage}" th:text="${infoMessage}"></div>
                <form th:action="@{/login}" method="post">
                    <div class="field"><label for="username">[[#{auth.username.or.email}]]</label><input type="text" id="username" name="username" autocomplete="username" placeholder="username hoặc email@example.com" th:placeholder="#{auth.username.or.email.example.com}" required></div>
                    <div class="field"><label for="password">[[#{auth.password}]]</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
                    <div class="auth-options"><label><input type="checkbox" name="remember-me"> [[#{auth.remember.me}]]</label> <a th:href="@{/forgot-password}">[[#{auth.forgot.password.2}]]</a></div>
                    <button type="submit" class="btn btn--dark btn--block" style="height:50px">[[#{common.sign.in}]]</button>
                </form>
                <p class="auth-switch">[[#{auth.don.t.have.an.account}]] <a th:href="@{/register}">[[#{auth.sign.up.now}]]</a></p>
            </div>
        </div>
</div>
</main>
</body>
</html>
