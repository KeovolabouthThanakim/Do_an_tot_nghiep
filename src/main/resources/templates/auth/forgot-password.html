<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head(#{title.forgot}, 'pages')}"></head>
<body>
<main id="main" class="auth-page">
<div class="auth">
        <div class="auth__art">
            <img th:src="@{/images/collections/model-womens-editorial.jpg}" alt="">
            <div><h2>[[#{auth.welcome}]]<br>[[#{auth.back}]]</h2><p>[[#{auth.sign.in.to.track.your}]]</p></div>
        </div>
        <div class="auth__form">
            <a class="auth__logo" th:href="@{/}" aria-label="Trang chủ KOSIS" th:aria-label="#{common.kosis.home.page}">KOSIS</a>
            <a class="auth__back" th:href="@{/}"><i class="bi bi-arrow-left"></i> [[#{auth.back.to.home}]]</a>
            <div class="auth-box">
                <h1>[[#{auth.forgot.password}]]</h1>
                <p class="auth-subtitle">[[#{auth.enter.your.email.or.username}]]</p>
                <div hidden data-flash="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <div hidden data-flash="success" th:if="${successMessage}" th:text="${successMessage}"></div>
                <form th:action="@{/forgot-password}" method="post">
                    <div class="field"><label for="identifier">[[#{auth.email.or.username}]]</label><input type="text" id="identifier" name="identifier" autocomplete="username" maxlength="150" required></div>
                    <button type="submit" class="btn btn--dark btn--block" style="height:50px">[[#{auth.send.reset.link}]]</button>
                </form>
                <p class="auth-switch"><a th:href="@{/login}">[[#{auth.back.to.sign.in}]]</a></p>
            </div>
        </div>
</div>
</main>
</body>
</html>
