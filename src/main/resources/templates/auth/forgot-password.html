<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu | KOSIS', 'pages')}"></head>
<body>
<main id="main" class="auth-page">
<div class="auth">
        <div class="auth__art">
            <img th:src="@{/images/collections/model-womens-editorial.jpg}" alt="">
            <div><h2>Chào mừng<br>trở lại.</h2><p>Đăng nhập để theo dõi đơn hàng, lưu thông tin và thanh toán nhanh hơn.</p></div>
        </div>
        <div class="auth__form">
            <a class="auth__logo" th:href="@{/}" aria-label="Trang chủ KOSIS">KOSIS</a>
            <a class="auth__back" th:href="@{/}"><i class="bi bi-arrow-left"></i> Về trang chủ</a>
            <div class="auth-box">
                <h1>Quên mật khẩu</h1>
                <p class="auth-subtitle">Nhập email (hoặc tên đăng nhập) của bạn, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
                <div hidden data-flash="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <div hidden data-flash="success" th:if="${successMessage}" th:text="${successMessage}"></div>
                <form th:action="@{/forgot-password}" method="post">
                    <div class="field"><label for="identifier">Email hoặc tên đăng nhập</label><input type="text" id="identifier" name="identifier" autocomplete="username" maxlength="150" required></div>
                    <button type="submit" class="btn btn--dark btn--block" style="height:50px">Gửi link đặt lại mật khẩu</button>
                </form>
                <p class="auth-switch"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
            </div>
        </div>
</div>
</main>
</body>
</html>
