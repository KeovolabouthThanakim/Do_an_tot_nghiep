<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head(#{title.reset}, 'pages')}"></head>
<body>
<main id="main" class="auth-page">
<div class="auth">
        <div class="auth__art">
            <img th:src="@{/images/collections/model-womens-editorial.jpg}" alt="">
            <div><h2>[[#{auth.welcome}]]<br>[[#{auth.back}]]</h2><p>[[#{auth.sign.in.to.track.your}]]</p></div>
        </div>
        <div class="auth__form">
            <a class="auth__logo" th:href="@{/}" aria-label="Trang chủ KOSIS" th:aria-label="#{common.kosis.home.page}">KOSIS</a>
            <a class="auth__back" th:href="@{/}"><i class="bi bi-arrow-left"></i> [[#{auth.back.to.home}]]</a>
            <div class="auth-box">
                <h1>[[#{auth.reset.password}]]</h1>
                <div hidden data-flash="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <th:block th:if="${invalid}">
                    <p class="auth-subtitle">[[#{auth.this.link.is.no.longer}]]</p>
                    <a th:href="@{/forgot-password}" class="btn btn--dark btn--block" style="height:50px;display:flex;align-items:center;justify-content:center">[[#{auth.request.a.new.link}]]</a>
                </th:block>
                <th:block th:unless="${invalid}">
                    <p class="auth-subtitle">[[#{auth.enter.a.new.password.for}]]</p>
                    <form th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}">
                        <div class="field"><label for="password">[[#{common.new.password}]]</label><input type="password" id="password" name="password" minlength="6" maxlength="72" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" th:placeholder="#{auth.at.least.6.characters}" required></div>
                        <div class="field"><label for="confirmPassword">[[#{common.confirm.new.password}]]</label><input type="password" id="confirmPassword" name="confirmPassword" minlength="6" maxlength="72" autocomplete="new-password" required></div>
                        <button type="submit" class="btn btn--dark btn--block" style="height:50px">[[#{auth.reset.password}]]</button>
                    </form>
                </th:block>
                <p class="auth-switch"><a th:href="@{/login}">[[#{auth.back.to.sign.in}]]</a></p>
            </div>
        </div>
</div>
</main>
</body>
</html>
