<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu | KOSIS', 'pages')}"></head>
<body>
<main id="main" class="auth-page">
<div class="auth">
        <div class="auth__art">
            <img th:src="@{/images/collections/model-womens-editorial.jpg}" alt="">
            <div><h2>Chào mừng<br>trở lại.</h2><p>Đăng nhập để theo dõi đơn hàng, lưu thông tin và thanh toán nhanh hơn.</p></div>
        </div>
        <div class="auth__form">
            <a class="auth__logo" th:href="@{/}" aria-label="Trang chủ KOSIS">KOSIS</a>
            <a class="auth__back" th:href="@{/}"><i class="bi bi-arrow-left"></i> Về trang chủ</a>
            <div class="auth-box">
                <h1>Đặt lại mật khẩu</h1>
                <div hidden data-flash="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <th:block th:if="${invalid}">
                    <p class="auth-subtitle">Link này không còn dùng được. Hãy yêu cầu một link mới.</p>
                    <a th:href="@{/forgot-password}" class="btn btn--dark btn--block" style="height:50px;display:flex;align-items:center;justify-content:center">Yêu cầu link mới</a>
                </th:block>
                <th:block th:unless="${invalid}">
                    <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>
                    <form th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}">
                        <div class="field"><label for="password">Mật khẩu mới</label><input type="password" id="password" name="password" minlength="6" maxlength="72" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" required></div>
                        <div class="field"><label for="confirmPassword">Nhập lại mật khẩu mới</label><input type="password" id="confirmPassword" name="confirmPassword" minlength="6" maxlength="72" autocomplete="new-password" required></div>
                        <button type="submit" class="btn btn--dark btn--block" style="height:50px">Đặt lại mật khẩu</button>
                    </form>
                </th:block>
                <p class="auth-switch"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
            </div>
        </div>
</div>
</main>
</body>
</html>
