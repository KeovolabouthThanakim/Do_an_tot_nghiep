<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head(${page.title + ' | KOSIS'}, 'pages')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<main id="main">
<div class="container container--content">
    <div class="page-head"><p class="eyebrow" th:text="${page.eyebrow}">CUSTOMER SERVICE</p><h1 class="display" th:text="${page.title}">Title</h1><p th:text="${page.lede}">Lede</p></div>
    <div class="info">
        <section th:each="s : ${page.sections}"><h2 th:text="${#strings.replace(s.heading, '@@RETURN_DAYS@@', returnWindowDays + '')}">Heading</h2><p th:text="${#strings.replace(s.body, '@@RETURN_DAYS@@', returnWindowDays + '')}">Body</p></section>
    </div>
</div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
