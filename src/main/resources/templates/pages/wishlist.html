<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{title.wishlist}, 'shop')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<main id="main">
    <div class="container container--content">
        <div class="page-head wl-head">
            <div><p class="eyebrow">[[#{wishlist.saved.items}]]</p><h1 class="display">[[#{common.wishlist}]]</h1></div>
            <span class="count" data-wishlist-total></span>
        </div>
        <div class="empty" data-wishlist-empty hidden>
            <i class="bi bi-heart"></i>
            <h2>[[#{wishlist.your.wishlist.is.empty}]]</h2>
            <p>[[#{wishlist.tap.the.heart.icon.on}]]</p>
            <a class="btn btn--dark" th:href="@{/collections}">[[#{common.explore.the.collection}]]</a>
        </div>
        <div class="grid" data-wishlist-grid>
            <th:block th:each="p : ${products}">
                <th:block th:replace="~{fragments/layout :: productCard(${p}, 'tile')}"></th:block>
            </th:block>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
