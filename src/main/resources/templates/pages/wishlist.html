<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yêu thích | KOSIS', 'shop')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<main id="main">
    <div class="container container--content">
        <div class="page-head wl-head">
            <div><p class="eyebrow">SẢN PHẨM ĐÃ LƯU</p><h1 class="display">Yêu thích</h1></div>
            <span class="count" data-wishlist-total></span>
        </div>
        <div class="empty" data-wishlist-empty hidden>
            <i class="bi bi-heart"></i>
            <h2>Danh sách yêu thích đang trống</h2>
            <p>Nhấn vào biểu tượng trái tim trên sản phẩm để lưu tại đây. Đăng nhập để danh sách được lưu theo tài khoản và dùng được trên mọi thiết bị.</p>
            <a class="btn btn--dark" th:href="@{/collections}">Khám phá bộ sưu tập</a>
        </div>
        <div class="grid" data-wishlist-grid>
            <th:block th:each="p : ${products}">
                <th:block th:replace="~{fragments/layout :: productCard(${p}, 'tile')}"></th:block>
            </th:block>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
