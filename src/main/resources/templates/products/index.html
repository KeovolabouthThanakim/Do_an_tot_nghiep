<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head(${pageTitle + ' | KOSIS'}, 'shop')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>

<main id="main">
    <!-- Banner (gender / sale / gift pages) or plain heading (search) -->
    <section class="banner" th:if="${heroImage != null}">
        <img th:src="@{${heroImage + '.jpg'}}" alt="" fetchpriority="high">
        <div class="banner__in">
            <p class="eyebrow" th:text="${pageEyebrow}">KOSIS</p>
            <h1 class="display" th:text="${pageTitle}">Collection</h1>
            <p th:if="${pageLede != null}" th:text="${pageLede}">Lede</p>
        </div>
    </section>
    <div class="container container--content" th:if="${heroImage == null}">
        <div class="page-head">
            <p class="eyebrow" th:text="${pageEyebrow}">SEARCH</p>
            <h1 class="display" th:text="${pageTitle}">Search</h1>
            <p th:if="${pageLede != null}" th:text="${pageLede}">Lede</p>
        </div>
    </div>

    <div class="container container--content">

        <div class="toolbar">
            <div class="toolbar__tabs">
                <th:block th:if="${showGenderTabs != null}">
                    <a class="chip" th:classappend="${#strings.isEmpty(activeGender)} ? 'is-on'" th:href="@{/collections(category=${activeCategory}, sort=${sort})}">[[#{common.all}]]</a>
                    <a class="chip" th:classappend="${activeGender == 'MEN'} ? 'is-on'" th:href="@{/collections(gender='MEN', category=${activeCategory}, sort=${sort})}">[[#{common.men}]]</a>
                    <a class="chip" th:classappend="${activeGender == 'WOMEN'} ? 'is-on'" th:href="@{/collections(gender='WOMEN', category=${activeCategory}, sort=${sort})}">[[#{common.women}]]</a>
                    <a class="chip" th:classappend="${activeGender == 'KIDS'} ? 'is-on'" th:href="@{/collections(gender='KIDS', category=${activeCategory}, sort=${sort})}">[[#{common.kids}]]</a>
                    <span aria-hidden="true" style="width:12px"></span>
                </th:block>
                <a class="chip" th:classappend="${#strings.isEmpty(activeCategory)} ? 'is-on'" th:href="@{${basePath}(sort=${sort}, q=${query}, gender=${activeGender ?: ''})}">[[#{shop.all.categories}]]</a>
                <a class="chip" th:each="c : ${categories}" th:classappend="${c == activeCategory} ? 'is-on'" th:text="${c}"
                   th:href="@{${basePath}(category=${c}, sort=${sort}, q=${query}, gender=${activeGender ?: ''})}">Outerwear</a>
            </div>
            <form class="toolbar__right" th:action="@{${basePath}}" method="get">
                <span class="count" th:text="${productCount > 0 and totalPages > 1} ? #{shop.range(${rangeFrom}, ${rangeTo}, ${productCount})} : #{common.products.count(${productCount})}">12 sản phẩm</span>
                <input type="hidden" name="category" th:value="${activeCategory}">
                <input type="hidden" name="q" th:value="${query}" th:if="${searchPage != null}">
                <input type="hidden" name="gender" th:value="${activeGender}" th:if="${showGenderTabs != null}">
                <label class="sr-only" for="sort">[[#{shop.sort.by}]]</label>
                <select class="sort" id="sort" name="sort" data-autosubmit>
                    <option value="featured" th:selected="${sort == 'featured'}">[[#{shop.featured}]]</option>
                    <option value="newest" th:selected="${sort == 'newest'}">[[#{shop.newest}]]</option>
                    <option value="price-asc" th:selected="${sort == 'price-asc'}">[[#{shop.price.low.to.high}]]</option>
                    <option value="price-desc" th:selected="${sort == 'price-desc'}">[[#{shop.price.high.to.low}]]</option>
                </select>
                <noscript><button class="btn btn--dark btn--sm" type="submit">[[#{common.apply}]]</button></noscript>
            </form>
        </div>

        <div class="grid" th:if="${!#lists.isEmpty(products)}">
            <th:block th:each="p : ${products}">
                <th:block th:replace="~{fragments/layout :: productCard(${p}, 'tile')}"></th:block>
            </th:block>
        </div>

        <nav class="pager" th:if="${totalPages > 1}" aria-label="Phân trang" th:aria-label="#{shop.pagination}">
            <a class="pager__btn" th:if="${currentPage > 1}" rel="prev" aria-label="Trang trước" th:aria-label="#{shop.previous.page}"
               th:href="@{${basePath}(page=${currentPage - 1}, category=${activeCategory}, sort=${sort}, q=${query}, gender=${activeGender ?: ''})}"><i class="bi bi-chevron-left"></i></a>
            <span class="pager__btn is-disabled" th:if="${currentPage == 1}" aria-hidden="true"><i class="bi bi-chevron-left"></i></span>
            <th:block th:each="n : ${pageNumbers}">
                <span class="pager__gap" th:if="${n == 0}" aria-hidden="true">…</span>
                <a class="pager__btn" th:if="${n != 0}" th:classappend="${n == currentPage} ? 'is-on'" th:text="${n}"
                   th:aria-current="${n == currentPage} ? 'page'"
                   th:href="@{${basePath}(page=${n}, category=${activeCategory}, sort=${sort}, q=${query}, gender=${activeGender ?: ''})}">1</a>
            </th:block>
            <a class="pager__btn" th:if="${currentPage < totalPages}" rel="next" aria-label="Trang sau" th:aria-label="#{shop.next.page}"
               th:href="@{${basePath}(page=${currentPage + 1}, category=${activeCategory}, sort=${sort}, q=${query}, gender=${activeGender ?: ''})}"><i class="bi bi-chevron-right"></i></a>
            <span class="pager__btn is-disabled" th:if="${currentPage == totalPages}" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
        </nav>

        <div class="empty" th:if="${#lists.isEmpty(products)}">
            <i class="bi bi-search"></i>
            <h2 th:text="${searchPage != null and #strings.isEmpty(query)} ? #{shop.search.prompt} : #{shop.search.none}">Nothing found</h2>
            <p th:text="${searchPage != null} ? #{shop.search.try} : #{shop.filter.none}">Try again</p>
            <div class="chips" style="justify-content:center;margin-bottom:24px" th:if="${searchPage != null}">
                <a class="chip" th:each="s : ${popularSearches}" th:href="@{/search(q=${s})}" th:text="${s}">Sneakers</a>
            </div>
            <a class="btn btn--dark" th:href="@{/collections}">[[#{shop.view.all.products}]]</a>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
